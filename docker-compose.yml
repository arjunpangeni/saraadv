services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: asar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asar
      POSTGRES_PASSWORD: asar_dev_password
      POSTGRES_DB: asar_partners
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - asar_postgres_data:/var/lib/postgresql/data

volumes:
  asar_postgres_data:
